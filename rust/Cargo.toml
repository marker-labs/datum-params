[package]
name = "datum-params-tools"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "datum_params_tools"
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
